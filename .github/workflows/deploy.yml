name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
      working-directory: ./frontend
    
    - name: Update dependencies
      run: npm audit fix --force --legacy-peer-deps
      working-directory: ./frontend

    - name: Build project
      run: npm run build
      working-directory: ./frontend

    - name: Copy built files to root docs directory
      run: |
        rm -rf docs
        cp -r frontend/docs docs
        # Copy .nojekyll file from repository root
        cp .nojekyll docs/.nojekyll
        # Ensure SCSS directory exists for Jekyll
        mkdir -p docs/assets/css
        # Create dummy SCSS file if it doesn't exist
        if [ ! -f docs/assets/css/style.scss ]; then
          echo '/* Dummy SCSS file */ body { font-family: sans-serif; }' > docs/assets/css/style.scss
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs
        retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
